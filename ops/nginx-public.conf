pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  # Tierhive must overwrite this header; test HTTP spoofing before signed use.
  map $http_x_forwarded_proto $memory_https { default 0; https 1; }
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=memory:1m rate=2r/s;
  server {
    listen 8080 default_server;
    server_name _;
    return 444;
  }
  # Tierhive probes GET / with Host: 10.3.245.2:3014, not the domain.
  # This virtual host exposes process liveness only; never forward API paths.
  server {
    listen 8080;
    server_name 10.3.245.2;
    client_max_body_size 1k;
    client_header_timeout 5s;
    keepalive_timeout 5s;
    location = / {
      limit_except GET { deny all; }
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_set_header Host memory.useroot.xyz;
      proxy_pass http://portable-memory:8080/healthz;
    }
    location / { return 444; }
  }
  server {
    listen 8080;
    server_name memory.useroot.xyz;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    location = /healthz {
      proxy_set_header Host memory.useroot.xyz;
      proxy_pass http://portable-memory:8080;
    }
    location / {
      if ($memory_https = 0) { return 308 https://memory.useroot.xyz$request_uri; }
      limit_req zone=memory burst=8 nodelay;
      limit_req_status 429;
      proxy_connect_timeout 3s;
      proxy_read_timeout 90s;
      proxy_send_timeout 10s;
      proxy_request_buffering on;
      proxy_set_header Host memory.useroot.xyz;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_pass http://portable-memory:8080;
    }
  }
}
