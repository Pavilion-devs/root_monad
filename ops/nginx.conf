pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=memory:1m rate=2r/s;
  server {
    listen 8080 default_server;
    server_name _;
    return 444;
  }
  server {
    listen 8080;
    server_name memory.useroot.xyz;
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    location = /healthz {
      proxy_set_header Host memory.useroot.xyz;
      proxy_pass http://portable-memory:8080;
    }
    location / {
      limit_req zone=memory burst=8 nodelay;
      limit_req_status 429;
      proxy_connect_timeout 3s;
      proxy_read_timeout 90s;
      proxy_send_timeout 10s;
      proxy_request_buffering on;
      proxy_set_header Host memory.useroot.xyz;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_pass http://portable-memory:8080;
    }
  }
}
